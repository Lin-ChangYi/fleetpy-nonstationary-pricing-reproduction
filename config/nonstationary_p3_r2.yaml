op_mab_use_exposure_prob: OVERWRITE_IN_SCENARIO_CONFIG
op_mab_htix_self_normalized: OVERWRITE_IN_SCENARIO_CONFIG
op_mab_htix_diagnostics: False
op_mab_reward_normalization: fixed
op_mab_reward_lower_bound: 0
op_mab_reward_upper_bound: 3953
op_mab_grid_beta_reward_upper_bound: 3953
op_mab_arms:
  - [0.8, 0.8]
  - [1.0, 1.0]
