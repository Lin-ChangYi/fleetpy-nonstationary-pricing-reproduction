sim_env: BatchOfferSimulation
log_level: info
network_type: NetworkTTMatrix
network_name: Manhattan_2019_corrected
nw_dynamic_f: 2018-11-12_mean_tt_factor_hourly.csv
demand_name: Manhattan_2018
random_seed: OVERWRITE_IN_SCENARIO_CONFIG
start_time: 0
end_time: 86400
time_step: 30
user_max_decision_time: 30
user_max_wait_time: 1200
show_progress_bar: False
route_output_flag: False
replay_flag: False
nr_mod_operators: 1

rq_type: TimeVaryingLogitPriceSensitiveIndividualConstraintRequest
rq_prob_accept_floor: 0.02
rq_prob_accept_ceiling: 0.98
rq_prob_accept_wait_penalty_per_min: 0.10
rq_prob_accept_wait_reference_min: 3.0
rq_logit_coefficient_schedule:
  - {start_time: 0, end_time: 25200, intercept: 1.60, price_sensitivity: 10.00}
  - {start_time: 25200, end_time: 36000, intercept: 2.20, price_sensitivity: 0.75}
  - {start_time: 36000, end_time: 57600, intercept: 3.30, price_sensitivity: 9.10}
  - {start_time: 57600, end_time: 72000, intercept: 1.60, price_sensitivity: 10.00}
  - {start_time: 72000, end_time: 86400, intercept: 2.20, price_sensitivity: 0.75}

op_module: RidePoolingBatchAssignmentFleetcontrol
op_rp_batch_optimizer: AlonsoMora
op_fleet_composition: {default_single_occupancy_vehtype: 400}
op_vr_control_func_dict: {func_key: distance_and_user_times_man, vot: 0.45833, dc: 0.0694}
op_min_wait_time: 0
op_max_wait_time: 1200
op_max_detour_time_factor: 40
op_const_boarding_time: 30
op_add_boarding_time: 0
op_base_fare: 50
op_distance_fare: 0.5
op_time_fare: 0
op_min_standard_fare: 100
op_reoptimisation_timestep: 30
op_treebuild_timeout_per_veh: 1
op_max_tours_per_v2rb: 4
op_optimisation_timeout: 30
op_applied_heuristic: after_opt_rv_best_v2rb
op_max_VR_con: 10
zone_system_name: Manhattan_Taxi_Zones
op_zone_system: Manhattan_Taxi_Zones
op_repo_method: PavoneFC
op_fc_type: perfect_trips
op_forecast_f: OVERWRITE_IN_SCENARIO_CONFIG
op_repo_horizons: [0, 2700]
op_repo_lock: False
op_repo_timestep: 900
op_temporal_resolution: 900

op_dyn_pricing_method: MABSpatialPricing
op_mab_zone_system: Manhattan_Grid_1500m
op_mab_interference_radius_override:
op_mab_random_assignment: False
op_mab_assignment_level: zone
op_mab_interval: 1800
op_mab_algorithm: OVERWRITE_IN_SCENARIO_CONFIG
